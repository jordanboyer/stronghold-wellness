<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 7 — Hotel Onboarding Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0b10; font-family: 'Outfit', sans-serif; color: #e8e6f0; }
  input, textarea { font-family: 'Outfit', sans-serif; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #11131a; } ::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

// ─── Config ───────────────────────────────────────────────────────────────────
const FUNCTION_URL = (
  window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
    ? "http://localhost:8888/.netlify/functions/hotel-research"
    : "/.netlify/functions/hotel-research"
);

const TEMPLATE_URL = "https://raw.githubusercontent.com/jordanboyer/stronghold-wellness/main/spectator/index.html";

const B = {
  bg: "#0a0b10", card: "#11131a", border: "#1e2230",
  accent: "#c9a84c", accentDim: "rgba(201,168,76,0.12)", accentBorder: "rgba(201,168,76,0.3)",
  text: "#e8e6f0", muted: "#6b7190", green: "#34d399", red: "#f87171",
};

// ─── Template Replacement Engine ─────────────────────────────────────────────
function applyReplacements(template, data) {
  let out = template;
  const { hotelConfig, conciergeLabel, localRefs } = data;
  const slug = hotelConfig.name.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");

  // 1. HOTEL_CONFIG block
  const newConfig = `const HOTEL_CONFIG = {
  name: "${hotelConfig.name}",
  subtitle: "${hotelConfig.subtitle}",
  location: "${hotelConfig.location}",
  accent: "${hotelConfig.accent}",
  accentLight: "${hotelConfig.accentLight}",
  dark: "${hotelConfig.dark}",
  cardBg: "${hotelConfig.cardBg}",
  cardBorder: "${hotelConfig.cardBorder}",
  textPrimary: "${hotelConfig.textPrimary}",
  textSecondary: "${hotelConfig.textSecondary}",
};`;
  out = out.replace(/const HOTEL_CONFIG = \{[\s\S]*?\};/, newConfig);

  // 2. Concierge label
  out = out.replace(/Butler Concierge/g, conciergeLabel || "Concierge");

  // 3. localStorage key
  out = out.replace(/"sh_unlocked"/g, `"sh_${slug}_unlocked"`);

  // 4. GA4 hotel tracking
  out = out.replace(/hotel:\s*'spectator'/g, `hotel: '${slug}'`);

  // 5. Location-specific cue replacements
  const { cityName, mainStreet, neighborhood, landmark, activity, waterfront, climate, localTree, localDrink, cityNickname, localAdj } = localRefs;

  const replacements = [
    // City name references
    ["Charleston Burn", `${cityName} Burn`],
    ["Charleston Arsenal", landmark || `${cityName} landmark`],
    ["Charleston day", `${localAdj || cityName} day`],
    // Streets & movement
    ["King Street", mainStreet || "Main Street"],
    ["on the cobblestones", `along ${mainStreet || "the streets"}`],
    ["on King Street", `on ${mainStreet || "the main street"}`],
    // Landmarks & neighborhoods
    ["the ornate ironwork that lines the streets of the French Quarter", `the architecture of ${neighborhood || cityName}`],
    ["steeples on Meeting Street", landmark || `towers of ${cityName}`],
    ["French Quarter", neighborhood || cityName],
    ["the French Quarter", neighborhood || cityName],
    ["Ravenel Bridge", landmark || `the ${cityName} bridge`],
    // Environment
    ["Lowcountry heat", climate || `${cityName} heat`],
    ["Lowcountry mornings", `${localAdj || cityName} mornings`],
    ["Lowcountry wind-down", `${localAdj || cityName} wind-down`],
    ["Lowcountry", localAdj || cityName],
    // Activity & local flavor
    ["carriage tour", activity || "local tour"],
    // Outdoors
    ["the Battery", waterfront || `the ${cityName} waterfront`],
    ["Battery", waterfront || `${cityName} waterfront`],
    // Flora & drink
    ["live oak", localTree || "local trees"],
    ["bourbon", localDrink || "local spirits"],
    // Nicknames
    ["Holy City", cityNickname || cityName],
    ["the Holy City", cityNickname || cityName],
    // Broad city references (do last to avoid partial replacements)
    ["Charleston, SC", hotelConfig.location],
    ["Charleston", cityName || hotelConfig.location.split(",")[0]],
  ];

  for (const [from, to] of replacements) {
    if (from && to && from !== to) {
      out = out.split(from).join(to);
    }
  }

  return out;
}

// ─── Components ───────────────────────────────────────────────────────────────

function Label({ children }) {
  return <p style={{ fontSize: 9, letterSpacing: 3, color: B.accent, fontWeight: 700, margin: "0 0 6px", textTransform: "uppercase" }}>{children}</p>;
}

function Field({ label, value, onChange, type = "text", mono = false }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <Label>{label}</Label>
      <input
        type={type}
        value={value}
        onChange={e => onChange(e.target.value)}
        style={{
          width: "100%", padding: "10px 12px",
          background: B.bg, color: mono ? B.accent : B.text,
          border: `1px solid ${B.border}`, borderRadius: 8,
          fontSize: mono ? 13 : 14, fontFamily: mono ? "monospace" : "'Outfit', sans-serif",
          outline: "none",
        }}
        onFocus={e => e.target.style.borderColor = B.accentBorder}
        onBlur={e => e.target.style.borderColor = B.border}
      />
    </div>
  );
}

function ColorField({ label, value, onChange }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <Label>{label}</Label>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <input
          type="color"
          value={value.startsWith("#") && value.length === 7 ? value : "#c9a84c"}
          onChange={e => onChange(e.target.value)}
          style={{ width: 40, height: 36, border: "none", borderRadius: 6, cursor: "pointer", background: "none", padding: 2 }}
        />
        <input
          type="text"
          value={value}
          onChange={e => onChange(e.target.value)}
          style={{
            flex: 1, padding: "10px 12px",
            background: B.bg, color: B.accent,
            border: `1px solid ${B.border}`, borderRadius: 8,
            fontSize: 13, fontFamily: "monospace", outline: "none",
          }}
          onFocus={e => e.target.style.borderColor = B.accentBorder}
          onBlur={e => e.target.style.borderColor = B.border}
        />
      </div>
    </div>
  );
}

function Card({ children, style = {} }) {
  return (
    <div style={{ background: B.card, border: `1px solid ${B.border}`, borderRadius: 14, padding: "20px", marginBottom: 16, ...style }}>
      {children}
    </div>
  );
}

function SectionHeader({ children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
      <p style={{ fontSize: 9, letterSpacing: 3, color: B.accent, fontWeight: 700, margin: 0 }}>{children}</p>
      <div style={{ flex: 1, height: 1, background: B.border }} />
    </div>
  );
}

// ─── Screens ──────────────────────────────────────────────────────────────────

function InputScreen({ onSubmit, loading, error }) {
  const [hotelName, setHotelName] = useState("");
  const [location, setLocation] = useState("");

  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "40px 20px" }}>
      <div style={{ textAlign: "center", marginBottom: 40 }}>
        <div style={{
          display: "inline-flex", alignItems: "center", gap: 8,
          background: B.accentDim, border: `1px solid ${B.accentBorder}`,
          borderRadius: 8, padding: "6px 14px", marginBottom: 16,
        }}>
          <span style={{ fontSize: 14 }}>🏨</span>
          <span style={{ fontSize: 10, letterSpacing: 3, color: B.accent, fontWeight: 700 }}>AGENT 7</span>
        </div>
        <h1 style={{ fontSize: 24, fontWeight: 700, color: B.text, marginBottom: 8, lineHeight: 1.2 }}>
          Hotel Onboarding Generator
        </h1>
        <p style={{ fontSize: 13, color: B.muted, lineHeight: 1.6 }}>
          Enter a hotel name and location. Claude will research the property, extract brand details, and generate a deploy-ready portal file.
        </p>
      </div>

      <Card>
        <Field label="Hotel Name" value={hotelName} onChange={setHotelName} />
        <Field label="Location (City, State)" value={location} onChange={setLocation} />

        {error && (
          <div style={{ background: "rgba(248,113,113,0.08)", border: "1px solid rgba(248,113,113,0.25)", borderRadius: 8, padding: "10px 14px", marginBottom: 14 }}>
            <p style={{ fontSize: 12, color: B.red }}>{error}</p>
          </div>
        )}

        <button
          onClick={() => onSubmit(hotelName.trim(), location.trim())}
          disabled={loading || !hotelName.trim() || !location.trim()}
          style={{
            width: "100%", padding: "14px", border: "none",
            background: loading || !hotelName.trim() || !location.trim() ? B.border : B.accent,
            color: loading || !hotelName.trim() || !location.trim() ? B.muted : "#0a0b10",
            borderRadius: 10, fontSize: 14, fontWeight: 700, letterSpacing: 1,
            cursor: loading || !hotelName.trim() || !location.trim() ? "not-allowed" : "pointer",
            transition: "all 0.2s",
          }}
        >
          {loading ? "Researching..." : "RESEARCH HOTEL →"}
        </button>
      </Card>

      <p style={{ textAlign: "center", fontSize: 11, color: B.muted, lineHeight: 1.6 }}>
        Requires <code style={{ background: B.card, padding: "1px 5px", borderRadius: 3, color: B.accent }}>ANTHROPIC_API_KEY</code> in Netlify env vars.<br />
        For local testing: <code style={{ background: B.card, padding: "1px 5px", borderRadius: 3, color: B.accent }}>npx netlify dev</code>
      </p>
    </div>
  );
}

function LoadingScreen({ hotelName }) {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "80px 20px", textAlign: "center" }}>
      <div style={{
        width: 64, height: 64, borderRadius: "50%", margin: "0 auto 24px",
        border: `3px solid ${B.border}`,
        borderTopColor: B.accent,
        animation: "spin 0.8s linear infinite",
      }} />
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      <h2 style={{ fontSize: 20, fontWeight: 600, color: B.text, marginBottom: 8 }}>
        Researching {hotelName}...
      </h2>
      <p style={{ fontSize: 13, color: B.muted, lineHeight: 1.6 }}>
        Searching the web for brand colors, amenities, and local details.<br />
        This takes 10–25 seconds.
      </p>
    </div>
  );
}

function ResultsScreen({ data, hotelName, onGenerate, onReset, generating }) {
  const [config, setConfig] = useState(data.hotelConfig);
  const [concierge, setConcierge] = useState(data.conciergeLabel || "Concierge");
  const [hasFitness, setHasFitness] = useState(data.hasFitnessCenter || false);
  const [refs, setRefs] = useState(data.localRefs || {});

  const updateConfig = (key, val) => setConfig(c => ({ ...c, [key]: val }));
  const updateRef = (key, val) => setRefs(r => ({ ...r, [key]: val }));

  return (
    <div style={{ maxWidth: 560, margin: "0 auto", padding: "32px 20px 60px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 24 }}>
        <button onClick={onReset} style={{ background: "none", border: "none", color: B.muted, cursor: "pointer", fontSize: 20 }}>‹</button>
        <div>
          <h2 style={{ fontSize: 18, fontWeight: 700, color: B.text, margin: 0 }}>{hotelName}</h2>
          <p style={{ fontSize: 11, color: B.accent, margin: 0, letterSpacing: 1 }}>REVIEW & EDIT · THEN GENERATE</p>
        </div>
      </div>

      {data.researchNotes && (
        <Card style={{ borderColor: B.accentBorder, background: B.accentDim }}>
          <p style={{ fontSize: 10, letterSpacing: 2, color: B.accent, fontWeight: 700, marginBottom: 6 }}>RESEARCH NOTES</p>
          <p style={{ fontSize: 13, color: B.text, lineHeight: 1.6 }}>{data.researchNotes}</p>
        </Card>
      )}

      <Card>
        <SectionHeader>Brand Config (HOTEL_CONFIG)</SectionHeader>
        <Field label="Hotel Name (ALL CAPS)" value={config.name} onChange={v => updateConfig("name", v)} />
        <Field label="Location" value={config.location} onChange={v => updateConfig("location", v)} />
        <ColorField label="Accent Color" value={config.accent} onChange={v => updateConfig("accent", v)} />
        <ColorField label="Accent Light" value={config.accentLight} onChange={v => updateConfig("accentLight", v)} />
        <Field label="Card Border (rgba)" value={config.cardBorder} onChange={v => updateConfig("cardBorder", v)} mono />
      </Card>

      <Card>
        <SectionHeader>Property Details</SectionHeader>
        <Field label="Concierge Label" value={concierge} onChange={setConcierge} />
        <div style={{ marginBottom: 14 }}>
          <Label>Fitness Center / Gym On-Site</Label>
          <div style={{ display: "flex", gap: 10 }}>
            {[true, false].map(v => (
              <button key={String(v)} onClick={() => setHasFitness(v)} style={{
                flex: 1, padding: "10px", border: `1px solid ${hasFitness === v ? B.accent : B.border}`,
                background: hasFitness === v ? B.accentDim : "transparent",
                borderRadius: 8, color: hasFitness === v ? B.accent : B.muted,
                fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}>{v ? "Yes" : "No"}</button>
            ))}
          </div>
        </div>
      </Card>

      <Card>
        <SectionHeader>Local References (Session Copy)</SectionHeader>
        <p style={{ fontSize: 12, color: B.muted, marginBottom: 16, lineHeight: 1.5 }}>
          These replace Charleston-specific phrases in session descriptions and exercise cues.
        </p>
        {[
          ["cityName", "City Name"],
          ["mainStreet", "Main Street / Shopping Area"],
          ["neighborhood", "Neighborhood / District"],
          ["landmark", "Nearby Landmark"],
          ["activity", "Local Guest Activity"],
          ["waterfront", "Waterfront / Park"],
          ["climate", "Climate Descriptor"],
          ["localTree", "Iconic Local Tree / Plant"],
          ["localDrink", "Local Drink / Specialty"],
          ["cityNickname", "City Nickname"],
          ["localAdj", "Local Adjective"],
        ].map(([key, label]) => (
          <Field key={key} label={label} value={refs[key] || ""} onChange={v => updateRef(key, v)} />
        ))}
      </Card>

      <button
        onClick={() => onGenerate({ hotelConfig: config, conciergeLabel: concierge, hasFitnessCenter: hasFitness, localRefs: refs })}
        disabled={generating}
        style={{
          width: "100%", padding: "16px", border: "none",
          background: generating ? B.border : B.accent,
          color: generating ? B.muted : "#0a0b10",
          borderRadius: 12, fontSize: 14, fontWeight: 700, letterSpacing: 1.5,
          cursor: generating ? "not-allowed" : "pointer", transition: "all 0.2s",
        }}
      >
        {generating ? "GENERATING PORTAL..." : "GENERATE PORTAL FILE →"}
      </button>

      <button onClick={onReset} style={{
        width: "100%", marginTop: 12, padding: "12px", background: "transparent",
        border: `1px solid ${B.border}`, borderRadius: 10, color: B.muted,
        fontSize: 13, cursor: "pointer",
      }}>↩ Start Over</button>
    </div>
  );
}

function SuccessScreen({ hotelName, onReset, downloadFn }) {
  return (
    <div style={{ maxWidth: 480, margin: "0 auto", padding: "80px 20px", textAlign: "center" }}>
      <div style={{
        width: 64, height: 64, borderRadius: "50%", margin: "0 auto 24px",
        background: "rgba(52,211,153,0.1)", border: "2px solid rgba(52,211,153,0.4)",
        display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28,
      }}>✓</div>
      <h2 style={{ fontSize: 22, fontWeight: 700, color: B.text, marginBottom: 8 }}>Portal Generated</h2>
      <p style={{ fontSize: 14, color: B.muted, marginBottom: 32, lineHeight: 1.6 }}>
        Your portal file for <strong style={{ color: B.text }}>{hotelName}</strong> is ready.<br />
        Review the downloaded HTML, adjust any copy, then deploy to Netlify.
      </p>

      <Card style={{ textAlign: "left" }}>
        <p style={{ fontSize: 10, letterSpacing: 2, color: B.accent, fontWeight: 700, marginBottom: 10 }}>NEXT STEPS</p>
        {[
          "Open the downloaded HTML in Chrome to preview",
          "Check colors and session copy for accuracy",
          "Create a new folder in the repo (e.g. hotel-slug/)",
          "Save as index.html and push to GitHub",
          "Netlify auto-deploys to wellness.strongholdfitness.co/hotel-slug",
          "Generate the staff one-pager using staff-one-pager/ as a template",
        ].map((step, i) => (
          <div key={i} style={{ display: "flex", gap: 10, marginBottom: 8, alignItems: "flex-start" }}>
            <div style={{
              width: 20, height: 20, borderRadius: "50%", background: B.accentDim,
              border: `1px solid ${B.accentBorder}`, display: "flex", alignItems: "center",
              justifyContent: "center", flexShrink: 0, marginTop: 1,
            }}>
              <span style={{ fontSize: 10, color: B.accent, fontWeight: 700 }}>{i + 1}</span>
            </div>
            <p style={{ fontSize: 13, color: B.muted, lineHeight: 1.5, margin: 0 }}>{step}</p>
          </div>
        ))}
      </Card>

      <button onClick={downloadFn} style={{
        width: "100%", padding: "14px", border: "none",
        background: B.accent, color: "#0a0b10",
        borderRadius: 10, fontSize: 14, fontWeight: 700, letterSpacing: 1,
        cursor: "pointer", marginBottom: 12,
      }}>↓ DOWNLOAD PORTAL FILE</button>

      <button onClick={onReset} style={{
        width: "100%", padding: "12px", background: "transparent",
        border: `1px solid ${B.border}`, borderRadius: 10, color: B.muted,
        fontSize: 13, cursor: "pointer",
      }}>↩ Onboard Another Hotel</button>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function HotelOnboardingGenerator() {
  const [screen, setScreen] = useState("input");
  const [loading, setLoading] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [error, setError] = useState("");
  const [researchData, setResearchData] = useState(null);
  const [hotelName, setHotelName] = useState("");
  const generatedFileRef = useRef(null);
  const generatedNameRef = useRef("");

  async function handleResearch(name, location) {
    if (!name || !location) return;
    setError("");
    setLoading(true);
    setHotelName(name);
    setScreen("loading");

    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hotelName: name, location }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Research failed");
      setResearchData(data);
      setScreen("results");
    } catch (e) {
      setError(e.message);
      setScreen("input");
    } finally {
      setLoading(false);
    }
  }

  async function handleGenerate(finalData) {
    setGenerating(true);
    try {
      const template = await fetch(TEMPLATE_URL).then(r => {
        if (!r.ok) throw new Error("Could not fetch portal template from GitHub");
        return r.text();
      });

      const generated = applyReplacements(template, finalData);
      generatedFileRef.current = generated;

      const slug = finalData.hotelConfig.name.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
      generatedNameRef.current = `${slug}-wellness-portal.html`;

      setScreen("success");
    } catch (e) {
      alert("Generation error: " + e.message);
    } finally {
      setGenerating(false);
    }
  }

  function handleDownload() {
    if (!generatedFileRef.current) return;
    const blob = new Blob([generatedFileRef.current], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = generatedNameRef.current;
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleReset() {
    setScreen("input");
    setResearchData(null);
    setError("");
    generatedFileRef.current = null;
  }

  return (
    <div style={{ minHeight: "100vh", background: B.bg, paddingBottom: 40 }}>
      {/* Header bar */}
      <div style={{
        borderBottom: `1px solid ${B.border}`, padding: "14px 20px",
        display: "flex", alignItems: "center", gap: 12,
      }}>
        <span style={{ fontSize: 10, letterSpacing: 3, color: B.accent, fontWeight: 700 }}>STRONGHOLD WELLNESS</span>
        <div style={{ width: 1, height: 14, background: B.border }} />
        <span style={{ fontSize: 10, letterSpacing: 2, color: B.muted }}>AGENT 7 · HOTEL ONBOARDING GENERATOR</span>
      </div>

      {screen === "input" && <InputScreen onSubmit={handleResearch} loading={loading} error={error} />}
      {screen === "loading" && <LoadingScreen hotelName={hotelName} />}
      {screen === "results" && researchData && (
        <ResultsScreen
          data={researchData}
          hotelName={hotelName}
          onGenerate={handleGenerate}
          onReset={handleReset}
          generating={generating}
        />
      )}
      {screen === "success" && (
        <SuccessScreen hotelName={hotelName} onReset={handleReset} downloadFn={handleDownload} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HotelOnboardingGenerator />);
</script>
</body>
</html>
